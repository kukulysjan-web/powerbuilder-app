function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function makeRun(name,split){return{id:uid(),name,split,created:new Date().toISOString(),week:1,day:0,oneRM:{squat:0,bench:0,deadlift:0},log:{},completed:[]}}
function save(){localStorage.setItem('ppbAppV3',JSON.stringify(state))}function run(){return state.runs.find(x=>x.id===state.active)||state.runs[0]}function k(w,d,i){return `${run().split}|${w}|${d}|${i}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function day(){return PROGRAM[run().split][run().week][run().day]}
function logFor(i){return run().log[k(run().week,run().day,i)]||{}}function displayEx(e,i){return logFor(i).exercise||e.exercise}function opts(e){return [...new Set(VARIANTS[e]||[e,'DEINE EIGENE ÜBUNG'])]}
function theme(){document.documentElement.dataset.theme=state.theme;document.getElementById('themeBtn').textContent=state.theme==='dark'?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=state.theme==='dark'?'#0a0d12':'#f2f4f7'}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();theme()}
function render(){let r=run(), days=PROGRAM[r.split][r.week];document.getElementById('runTitle').textContent=`${r.name} · ${r.split} · Woche ${r.week}/10 · Tag ${r.day+1}/${days.length}`;['squat','bench','deadlift'].forEach((x,j)=>document.getElementById(['rmSquat','rmBench','rmDeadlift'][j]).value=r.oneRM?.[x]||'');document.getElementById('splitNav').innerHTML=SPLITS.map(s=>`<button class="${r.split===s?'active':''}" onclick="changeSplit('${s}')">${s}</button>`).join('');
let tot=0,done=0;day().forEach((e,i)=>{let n=+e.sets||1;tot+=n;done+=(logFor(i).sets||[]).filter(x=>x.ok).length});let pct=tot?Math.round(done/tot*100):0;
document.getElementById('app').innerHTML=`<div class="grid2"><select onchange="setWeek(this.value)">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${r.week===i+1?'selected':''}>Woche ${i+1}</option>`).join('')}</select><select onchange="setDay(this.value)">${days.map((_,i)=>`<option value="${i}" ${r.day===i?'selected':''}>Trainingstag ${i+1}</option>`).join('')}</select></div><div class="card"><div class="row"><div><div class="meta">AKTUELLE EINHEIT</div><div class="exercise">Woche ${r.week} · Trainingstag ${r.day+1}</div></div><span class="tag">${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="section">Training</div>${day().map((e,i)=>card(e,i)).join('')}<div class="card"><button class="primary wide" onclick="finishSession()">Einheit abschließen & speichern</button></div>`;theme()}
function mainLift(ex){if(ex.includes('KNIE'))return'squat';if(ex.includes('BANK'))return'bench';if(ex.includes('KREUZ'))return'deadlift';return null}function rounded(x){return Math.round(x/2.5)*2.5}
function suggested(e,i){if(typeof e.percent==='number'){let lift=mainLift(e.exercise),rm=lift?run().oneRM?.[lift]:0;if(rm)return rounded(rm*e.percent)}return carriedWeight(e,i)}
function carriedWeight(e,i){for(let w=run().week-1;w>=1;w--){let prevDays=PROGRAM[run().split][w]||[];let candidates=[];prevDays.forEach((d,di)=>d.forEach((pe,pi)=>{let L=run().log[`${run().split}|${w}|${di}|${pi}`];if(!L)return;let chosen=L.exercise||pe.exercise;if(chosen===displayEx(e,i)){let vals=(L.sets||[]).map(s=>+s.weight).filter(v=>v>0);if(vals.length)candidates.push(vals[vals.length-1])}}));if(candidates.length)return candidates[candidates.length-1]}return''}
function card(e,i){let l=logFor(i),n=+e.sets||1,sg=suggested(e,i),carry=typeof e.percent!=='number'&&sg!=='';let rows=Array.from({length:n},(_,s)=>{let z=l.sets?.[s]||{},pref=z.weight??sg??'';return `<div>${s+1}</div><input type="number" step="0.5" value="${pref}" placeholder="kg" onchange="setVal(${i},${s},'weight',this.value)"><input type="number" step="1" value="${z.reps??''}" placeholder="${esc(e.reps)}" onchange="setVal(${i},${s},'reps',this.value)"><button class="ok ${z.ok?'done':''}" onclick="toggleSet(${i},${s})">${z.ok?'✓':'○'}</button>`}).join('');return `<div class="card"><div class="row"><div><span class="tag">${esc(e.type)}</span><div class="exercise" style="margin-top:5px">${esc(displayEx(e,i))}</div><div class="meta">Warm-up ${esc(e.warm??'—')} · ${esc(e.sets)} Sätze · ${esc(e.reps)} Wdh. · RIR ${esc(e.rir??'—')} · ${esc(e.rest??'—')}</div></div><button onclick="startTimer(restSec('${esc(e.rest??'')}'))">⏱</button></div><div class="exgrid"><div class="field"><label>Übungsvariante</label><select onchange="setExercise(${i},this.value)">${opts(e.exercise).map(x=>`<option ${displayEx(e,i)===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>${typeof e.percent==='number'?Math.round(e.percent*1000)/10+' % vom 1RM':'Übernahme'}</label><input readonly value="${sg!==''?sg+' kg':'—'}"></div></div>${carry?`<div class="carry">↳ Gewicht aus einer vorherigen Woche übernommen</div>`:''}<div class="sets"><div>Satz</div><div>Gewicht</div><div>Wdh.</div><div>✓</div>${rows}</div><div class="field" style="margin-top:8px"><textarea rows="2" placeholder="Notiz …" onchange="setNote(${i},this.value)">${esc(l.note||'')}</textarea></div></div>`}
function ensure(i){let key=k(run().week,run().day,i);return run().log[key]||(run().log[key]={exercise:day()[i].exercise,sets:[]})}function setVal(i,s,n,v){let l=ensure(i);l.sets=l.sets||[];l.sets[s]=l.sets[s]||{};l.sets[s][n]=v===''?'':(+v);save()}function toggleSet(i,s){let l=ensure(i);l.sets=l.sets||[];l.sets[s]=l.sets[s]||{};if((l.sets[s].weight==null||l.sets[s].weight==='')){let sg=suggested(day()[i],i);if(sg!=='')l.sets[s].weight=sg}l.sets[s].ok=!l.sets[s].ok;save();render()}function setNote(i,v){ensure(i).note=v;save()}function setExercise(i,v){ensure(i).exercise=v;save();render()}function setRM(n,v){run().oneRM=run().oneRM||{};run().oneRM[n]=+v||0;save();render()}
function changeSplit(s){run().split=s;run().week=1;run().day=0;save();render()}function setWeek(v){run().week=+v;run().day=0;save();render()}function setDay(v){run().day=+v;save();render()}function finishSession(){let r=run();r.completed=r.completed||[];if(!r.completed.some(x=>x.week===r.week&&x.day===r.day))r.completed.push({date:new Date().toISOString(),week:r.week,day:r.day});let days=PROGRAM[r.split][r.week];if(r.day<days.length-1)r.day++;else if(r.week<10){r.week++;r.day=0}else alert('10 Wochen abgeschlossen. 🦾');save();render()}
function openRuns(){runsModal.style.display='block';renderRuns()}function closeRuns(){runsModal.style.display='none'}function renderRuns(){runList.innerHTML=state.runs.map(r=>`<div class="runitem"><div class="row"><div><strong>${esc(r.name)}</strong><div class="sub">${r.split} · Woche ${r.week}/10 · ${r.completed?.length||0} Einheiten</div></div><button class="${r.id===state.active?'active':''}" onclick="activate('${r.id}')">${r.id===state.active?'Aktiv':'Öffnen'}</button></div></div>`).join('')}function activate(id){state.active=id;save();closeRuns();render()}function newRun(){let name=prompt('Name des neuen Durchlaufs:',`Durchlauf ${state.runs.length+1}`);if(!name)return;let x=prompt('Variante: 2, 3, 4 oder 5 Tage','3');if(!['2','3','4','5'].includes(x))x='3';let r=makeRun(name,x+' TAGE');state.runs.push(r);state.active=r.id;save();closeRuns();render()}
let timerSec=120,timerRunning=false,timerInt=null;function restSec(s){let m=String(s).match(/(\d+)[–-](\d+)/);return(m?+m[1]:2)*60}function startTimer(s){timerSec=s||120;timer.style.display='block';timerRunning=true;clearInterval(timerInt);timerInt=setInterval(tick,1000);clock()}function toggleTimer(){timerRunning=!timerRunning;if(timerRunning)timerInt=setInterval(tick,1000);else clearInterval(timerInt);timerBtn.textContent=timerRunning?'Pause':'Start'}function tick(){if(timerSec<=0){timerRunning=false;clearInterval(timerInt);navigator.vibrate?.([180,80,180]);timerBtn.textContent='Start';return}timerSec--;clock()}function addTime(x){timerSec=Math.max(0,timerSec+x);clock()}function clock(){document.getElementById('clock').textContent=`${String(Math.floor(timerSec/60)).padStart(2,'0')}:${String(timerSec%60).padStart(2,'0')}`}function hideTimer(){clearInterval(timerInt);timerRunning=false;timer.style.display='none'}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block'});async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));theme();render();
</script></body></html>
